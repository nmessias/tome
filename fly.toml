app = "tome-in"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "3000"
# Enable Playwright browser fallback for Cloudflare-challenged sources (RoyalRoad)
ENABLE_BROWSER = "true"
# Cloudflare rejects the login POST when the browser runs headless, so the
# plugin drives a real Chromium window against an Xvfb display (see
# scripts/start.sh). Set to "true" only when debugging locally.
ROYAL_ROAD_HEADLESS = "false"
# "chromium" is the engine Cloudflare tolerates; "firefox" cannot log in.
ROYAL_ROAD_BROWSER = "chromium"
# Source plugins to load at startup (must also be installed in the image)
TOME_PLUGINS = "tome-source-royalroad,tome-source-freewebnovel,tome-feature-watch,tome-source-asura"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 3_000
min_machines_running = 1

  [[http_service.checks]]
  # Firefox solving a Cloudflare challenge saturates this machine; a short
  # grace period was failing checks mid-fetch and interrupting responses.
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "15s"

  [http_service.concurrency]
  hard_limit = 50
  soft_limit = 25
  type = "requests"

[[mounts]]
destination = "/app/data"
source = "tome_data"

[[vm]]
# The RoyalRoad scraper falls back to headless Firefox whenever Cloudflare
# challenges a request. On shared-cpu-1x/512mb Firefox thrashed (9s launch,
# 58s context creation, 60s navigation timeouts) and the machine ran out of
# breathing room for the rest of the app.
cpus = 2
memory = "2gb"
memory_mb = 2048
