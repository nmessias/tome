app = "tome-in"
# gru (São Paulo), next to the exit node: Cloudflare challenged 9/10 requests
# that reached the phone from iad (~200ms away) and none from gru (~40ms),
# same exit IP and client (measured 2026-11-02).
primary_region = "gru"
# Disk-backed headroom for parse peaks on the 256MB machine.
swap_size_mb = 512

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "3000"
# Royal Road is fetched over HTTP (impit, Firefox profile). Chromium (~220-330MB)
# does not fit 256MB, so there is no browser fallback: a Cloudflare challenge
# serves the saved copy, and the login session comes from scripts/rr-login.ts.
ENABLE_BROWSER = "false"
# One upstream fetch at a time; interactive requests go first.
ROYAL_ROAD_MAX_BROWSER_FETCHES = "1"
ROYAL_ROAD_FICTION_WARMS_PER_CYCLE = "0"
# Chapters to warm for the novel currently being read; set to 0 to disable.
ROYAL_ROAD_READ_AHEAD = "3"
# Requests route through the tailnet exit node (the Moto G75), so they leave
# from a residential IP instead of Fly's challenged datacenter IP. start.sh
# joins the tailnet and exports ROYAL_ROAD_PROXY when both variables are set;
# TS_AUTHKEY stays a fly secret (reusable + ephemeral key).
ROYAL_ROAD_USE_TAILSCALE = "true"
TS_EXIT_NODE = "100.115.240.61"
# tailscaled serves SOCKS at 127.0.0.1:1055, which impit uses directly. Only
# Chromium needs start.sh's DNS bridge (127.0.0.1:1056).
TOME_PLUGINS = "tome-source-royalroad,tome-feature-watch,tome-source-asura"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 3_000
min_machines_running = 1

  [[http_service.checks]]
  # A browser solving a Cloudflare challenge saturated this machine; a short
  # grace period was failing checks mid-fetch and interrupting responses.
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "15s"

  [http_service.concurrency]
  hard_limit = 50
  soft_limit = 25
  type = "requests"

[[mounts]]
destination = "/app/data"
source = "tome_data"

[[vm]]
# 1 vCPU / 256MB in gru: $3.54/month (Fly waives bills under $5; 512MB in gru
# is ~$5.96). Measured: Tome ~71-80MB idle (better-auth loads only on sign-in),
# tailscaled ~41MB, hallpass ~26MB, of ~215MB usable; swap covers parse peaks.
cpus = 1
memory = "256mb"
memory_mb = 256
