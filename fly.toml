app = "tome-in"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "3000"
# The browser is Royal Road's only transport (Cloudflare dropped impit). It runs
# headless: Cloudflare only objects to the "HeadlessChrome" UA token, which the
# plugin overrides with the real Chrome version. No Xvfb, no window.
ENABLE_BROWSER = "true"
ROYAL_ROAD_HEADLESS = "true"
ROYAL_ROAD_BROWSER = "chromium"
# Keep background work from competing with interactive requests on the 512 MB VM.
ROYAL_ROAD_MAX_BROWSER_FETCHES = "1"
ROYAL_ROAD_FICTION_WARMS_PER_CYCLE = "0"
# Chapters to warm for the novel currently being read; set to 0 to disable.
ROYAL_ROAD_READ_AHEAD = "3"
# The browser routes through the tailnet exit node (the Moto G75), so it leaves
# from a residential/mobile IP instead of Fly's blocked datacenter IP: the same
# headless browser is challenged on Fly's own IP. start.sh joins the tailnet and
# exports ROYAL_ROAD_PROXY when both variables are set; TS_AUTHKEY stays a fly
# secret (reusable + ephemeral key).
ROYAL_ROAD_USE_TAILSCALE = "true"
TS_EXIT_NODE = "100.115.240.61"
# tailscaled serves SOCKS at 127.0.0.1:1055. start.sh resolves hostnames with
# the app resolver and exports its bridge at 127.0.0.1:1056 after tailnet join.
TOME_PLUGINS = "tome-source-royalroad,tome-source-freewebnovel,tome-feature-watch,tome-source-asura"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 3_000
min_machines_running = 1

  [[http_service.checks]]
  # Firefox solving a Cloudflare challenge saturates this machine; a short
  # grace period was failing checks mid-fetch and interrupting responses.
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "15s"

  [http_service.concurrency]
  hard_limit = 50
  soft_limit = 25
  type = "requests"

[[mounts]]
destination = "/app/data"
source = "tome_data"

[[vm]]
# 1 vCPU / 512MB: about $3.69/month, the cheapest size that has a chance of
# fitting the app (~185MB: Bun, tailscaled, hallpass) plus one warm headless
# Chromium. Fly only sells RAM in 256MB steps, so the next option is 768MB at
# about $5.19. Chrome needs vm.overcommit_memory=1 here (see scripts/start.sh).
cpus = 1
memory = "512mb"
memory_mb = 512
